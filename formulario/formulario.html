<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./estilos/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Cadastre-se</title>
  </head>
  <body>
    <main id="form_container">
      <div id="form_header">
        <h1 id="form_titulo">Cadastre-se</h1>
        <button class="btn-default">
          <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
      </div>

      <form action="" id="form">
        <div id="input_container">
          <div class="input-box">
            <label for="name" class="form-label"> Primeiro nome </label>
            <div class="input-field">
              <input
                type="text"
                name="name"
                id="name"
                class="form-control"
                placeholder="Digite seu primeiro nome"
                required
              />
              <i class="fa-regular fa-user"></i>
            </div>
          </div>
          <div class="input-box">
            <label for="last_name" class="form-label"> Último nome </label>
            <div class="input-field">
              <input
                type="text"
                name="last_name"
                id="last_name"
                class="form-control"
                placeholder="Digite seu último nome"
                required
              />
              <i class="fa-regular fa-user"></i>
            </div>
          </div>
          <div class="input-box">
            <label for="birthdate" class="form-label"> Nascimento </label>
            <div class="input-field">
              <input
                type="date"
                name="birthdate"
                id="birthdate"
                class="form-control"
                required
              />
            </div>
          </div>
          <div class="input-box">
            <label for="email" class="form-label"> E-mail </label>
            <div class="input-field">
              <input
                type="email"
                name="email"
                id="email"
                class="form-control"
                placeholder="exemplo@dominio.com"
                required
              />
              <i class="fa-regular fa-envelope"></i>
            </div>
          </div>
          <div class="input-box">
            <label for="password" class="form-label"> senha </label>
            <div class="input-field">
              <input
                type="password"
                name="password"
                id="password"
                class="form-control"
                placeholder="********"
                required
              />
              <i class="fa-regular fa-eye-slash pass"></i>
            </div>
          </div>
          <div class="input-box">
            <label for="confirm_password" class="form-label">
              Confirmar senha
            </label>
            <div class="input-field">
              <input
                type="password"
                name="confirm_password"
                id="confirm_password"
                class="form-control"
                placeholder="********"
                required
              />
              <i class="fa-regular fa-eye-slash pass"></i>
            </div>
          </div>
          <div class="radio-container">
            <label class="form-label">Gênero</label>

            <div id="gender_inputs">
              <div class="radio-box">
                <input type="radio" name="gender" id="female" value="female" />
                <label for="female">Feminino</label>
              </div>
              <div class="radio-box">
                <input type="radio" name="gender" id="male" value="male" />
                <label for="male">Masculino</label>
              </div>
              <div class="radio-box">
                <input type="radio" name="gender" id="other" value="other" />
                <label for="other">Outro</label>
              </div>
            </div>
          </div>
        </div>
        <button type="submit" class="btn-default">
          <i class="fa-solid fa-check"></i> Cadastrar
        </button>
      </form>
    </main>
  </body>
</html>
